function setLang(l) {
  const d = D[l];
  document.documentElement.lang = l;
  document.getElementById('t').textContent = d.t;
  document.getElementById('u').textContent = d.u;
  document.getElementById('i').innerHTML = d.i;
  document.getElementById('l-del').textContent = d.del;
  document.getElementById('l-home').textContent = d.home;
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-bn').classList.toggle('active', l === 'bn');
  
  document.getElementById('body').innerHTML = d.s.map((s, idx) => `
    <div class="section">
      <h2><span class="badge">${idx + 1}</span> ${s[0].replace(/^[০-৯0-9]+\.\s*/, '')}</h2>
      <p>${s[1]}</p>
    </div>
  `).join('');
}

// Initialize with English as default for Google Play review compliance
setLang('en');
